<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="title" content="Random Picker">
  <meta property="og:title" content="Random Picker">
  <meta property="og:site_name" content="Random Picker">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Random Picker">
  <title>Random Picker</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #060e20;
      --surface: rgba(11, 19, 38, 0.56);
      --surface-strong: rgba(34, 42, 61, 0.72);
      --text: #dae2fd;
      --muted: #a9b2cc;
      --dim: rgba(204, 195, 216, 0.62);
      --primary: #d2bbff;
      --primary-strong: #7c3aed;
      --secondary: #ffb690;
      --tertiary: #89ceff;
      --cyan: #00d2ff;
      --line: rgba(255, 255, 255, 0.1);
      --shadow: 0 24px 120px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      max-width: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(124, 58, 237, 0.32), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(137, 206, 255, 0.24), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(236, 106, 6, 0.18), transparent 32%),
        var(--background);
      color: var(--text);
      font-family: Montserrat, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      selection-color: #25005a;
      selection-background-color: rgba(210, 187, 255, 0.75);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.8), transparent 74%);
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
    }

    .hero {
      flex: 1;
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: clamp(44px, 7vh, 88px) 24px 24px;
    }

    .winner-section {
      width: 100%;
      display: grid;
      gap: 20px;
      justify-items: center;
      text-align: center;
    }

    .kicker {
      margin: 0;
      color: var(--primary);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(11px, 1.6vw, 13px);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.76;
    }

    .kicker[hidden] {
      display: none;
    }

    .winner-stage {
      position: relative;
      width: min(980px, 92vw);
      min-height: clamp(320px, 56vw, 620px);
      display: grid;
      place-items: center;
      overflow: visible;
      isolation: isolate;
    }

    .winner-stage::before,
    .winner-stage::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(78vw, 760px);
      aspect-ratio: 1;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .winner-stage::before {
      z-index: -2;
      background:
        conic-gradient(from 110deg, transparent 0 18%, rgba(210, 187, 255, 0.88), rgba(137, 206, 255, 0.76), transparent 58% 100%);
      filter: blur(3px) drop-shadow(0 0 48px rgba(210, 187, 255, 0.36));
      opacity: 0.62;
      animation: orbit 14s linear infinite;
    }

    .winner-stage::after {
      z-index: -3;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.38), rgba(0, 109, 156, 0.18) 42%, transparent 70%);
      filter: blur(18px);
      transform: translate(-50%, -50%) scale(1.1);
    }

    .halo {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(70vw, 680px);
      aspect-ratio: 1;
      border: 1px solid rgba(210, 187, 255, 0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(68deg);
      box-shadow:
        0 0 42px rgba(137, 206, 255, 0.28),
        inset 0 0 36px rgba(210, 187, 255, 0.12);
      pointer-events: none;
      animation: halo-pulse 4.8s ease-in-out infinite;
    }

    .halo::before,
    .halo::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: inherit;
      border: 1px solid rgba(137, 206, 255, 0.22);
    }

    .halo::after {
      inset: 22%;
      border-color: rgba(255, 182, 144, 0.24);
      transform: rotate(34deg);
    }

    .winner {
      --winner-scale: 1;
      display: inline-block;
      margin: 0;
      padding: 0;
      max-width: 100%;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-family: "Bricolage Grotesque", ui-rounded, "Arial Rounded MT Bold", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(104px, 25vw, 380px);
      font-weight: 950;
      line-height: 0.82;
      letter-spacing: 0;
      text-align: center;
      overflow-wrap: anywhere;
      cursor: pointer;
      text-shadow:
        0 0 34px rgba(210, 187, 255, 0.62),
        0 0 110px rgba(124, 58, 237, 0.52),
        0 22px 70px rgba(0, 0, 0, 0.5);
      filter: drop-shadow(0 0 52px rgba(137, 206, 255, 0.24));
      scale: var(--winner-scale);
      transition:
        scale 500ms ease-out,
        filter 500ms ease-out,
        color 500ms ease-out;
      animation: winner-enter 900ms cubic-bezier(0.2, 0.9, 0.22, 1.18) both, float-winner 4s ease-in-out 900ms infinite;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .winner:hover:not(:disabled),
    .winner:focus-visible {
      --winner-scale: 1.05;
      outline: none;
      filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.5));
    }

    .winner:focus-visible {
      border-radius: 14px;
      outline: 2px solid rgba(137, 206, 255, 0.42);
      outline-offset: 12px;
    }

    .winner:disabled {
      cursor: default;
    }

    .winner[hidden] {
      display: none;
    }

    .starter-form {
      width: min(720px, 90vw);
      display: grid;
      gap: 18px;
      justify-items: center;
      animation: winner-enter 680ms cubic-bezier(0.2, 0.9, 0.22, 1.18) both;
    }

    .starter-form[hidden] {
      display: none;
    }

    .starter-title {
      margin: 0 0 10px;
      color: var(--primary);
      font-family: "Bricolage Grotesque", ui-rounded, "Arial Rounded MT Bold", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(56px, 11vw, 132px);
      font-weight: 950;
      line-height: 0.88;
      letter-spacing: 0;
      text-shadow:
        0 0 30px rgba(210, 187, 255, 0.5),
        0 0 90px rgba(124, 58, 237, 0.36);
    }

    .starter-label {
      color: rgba(210, 187, 255, 0.7);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .starter-controls {
      width: 100%;
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .starter-input {
      min-height: 58px;
      border-radius: 8px;
      font: inherit;
    }

    .starter-input {
      width: 100%;
      border: 1px solid rgba(210, 187, 255, 0.24);
      background: rgba(6, 14, 32, 0.6);
      color: var(--text);
      box-shadow:
        inset 0 0 26px rgba(137, 206, 255, 0.06),
        0 0 44px rgba(124, 58, 237, 0.14);
      padding: 0 18px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 850;
      letter-spacing: 0;
      text-align: center;
      outline: none;
    }

    .starter-input::placeholder {
      color: rgba(218, 226, 253, 0.32);
    }

    .starter-input:focus {
      border-color: rgba(137, 206, 255, 0.58);
      box-shadow:
        inset 0 0 30px rgba(137, 206, 255, 0.1),
        0 0 30px rgba(124, 58, 237, 0.28);
    }

    .starter-button {
      border: 0;
      background: transparent;
      color: rgba(210, 187, 255, 0.9);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.16em;
      cursor: pointer;
      padding: 4px 2px;
      text-transform: uppercase;
      transition: transform 160ms ease, color 160ms ease, filter 160ms ease;
    }

    .starter-button:hover,
    .starter-button:focus-visible {
      color: #fff0b6;
      outline: none;
      transform: translateY(-1px);
      filter: drop-shadow(0 0 18px rgba(124, 58, 237, 0.42));
    }

    .winner-copy-status {
      min-height: 18px;
      margin: -14px 0 0;
      color: rgba(255, 240, 182, 0.9);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .winner-copy-status.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .error {
      display: none;
      width: min(560px, 100%);
      margin: 0;
      padding: 0 16px;
      color: rgba(218, 226, 253, 0.68);
      font-size: 13px;
      line-height: 1.5;
    }

    .error.is-visible {
      display: block;
    }

    .info-dock {
      width: min(860px, calc(100% - 48px));
      margin: 0 auto;
      padding: 24px 0 38px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      gap: 18px;
      justify-items: center;
      opacity: 0.64;
      transition: opacity 180ms ease;
    }

    .info-dock:hover,
    .info-dock:focus-within {
      opacity: 1;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--dim);
    }

    .meta li {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .meta-label {
      color: rgba(210, 187, 255, 0.55);
      font-size: 10px;
    }

    .names {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      min-height: 30px;
    }

    .name {
      min-width: 32px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      background: rgba(19, 27, 46, 0.72);
      color: rgba(218, 226, 253, 0.52);
      font-size: 12px;
      font-weight: 700;
    }

    .name.is-winner {
      border-color: rgba(210, 187, 255, 0.38);
      background: rgba(210, 187, 255, 0.16);
      color: var(--primary);
      box-shadow: 0 0 22px rgba(210, 187, 255, 0.16);
    }

    .usage-card {
      width: min(500px, 100%);
      display: grid;
      gap: 12px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      opacity: 0.48;
      transition: opacity 160ms ease, background 160ms ease, border-color 160ms ease, padding 160ms ease;
    }

    .usage-card:hover,
    .usage-card:focus-within {
      opacity: 0.82;
    }

    .usage-card[open] {
      opacity: 0.74;
      padding: 16px;
      border-color: rgba(255, 255, 255, 0.06);
      background: rgba(11, 19, 38, 0.24);
      backdrop-filter: blur(18px);
    }

    .usage-card summary {
      cursor: pointer;
      list-style: none;
    }

    .usage-card summary::-webkit-details-marker {
      display: none;
    }

    .usage-card summary:focus-visible {
      border-radius: 6px;
      outline: 1px solid rgba(137, 206, 255, 0.26);
      outline-offset: 4px;
    }

    .usage-card summary::after {
      content: "Show";
      margin-left: auto;
      color: rgba(218, 226, 253, 0.34);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .usage-card[open] summary::after {
      content: "Hide";
    }

    .usage-title {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0;
      color: rgba(218, 226, 253, 0.56);
      font-size: 12px;
      font-weight: 800;
    }

    .usage-title-icon {
      position: relative;
      width: 14px;
      height: 9px;
      flex: 0 0 auto;
    }

    .usage-title-icon::before,
    .usage-title-icon::after {
      content: "";
      position: absolute;
      top: 1px;
      width: 7px;
      height: 5px;
      border: 1.5px solid currentColor;
      border-radius: 999px;
    }

    .usage-title-icon::before {
      left: 0;
    }

    .usage-title-icon::after {
      right: 0;
    }

    .usage-list {
      display: grid;
      gap: 12px;
      padding-top: 2px;
    }

    .usage-row {
      display: grid;
      gap: 6px;
    }

    .usage-label {
      color: rgba(218, 226, 253, 0.52);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .url-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 40px;
      align-items: center;
      min-height: 40px;
      border: 1px solid rgba(218, 226, 253, 0.12);
      border-radius: 8px;
      background: rgba(6, 14, 32, 0.36);
      color: var(--text);
      overflow: hidden;
    }

    .url-value {
      padding: 0 12px;
      overflow: hidden;
      color: rgba(218, 226, 253, 0.68);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-left: 1px solid rgba(218, 226, 253, 0.08);
      background: transparent;
      color: rgba(218, 226, 253, 0.52);
      cursor: pointer;
    }

    .copy-button:hover,
    .copy-button:focus-visible {
      color: var(--tertiary);
      outline: none;
      background: rgba(137, 206, 255, 0.08);
    }

    .copy-icon {
      position: relative;
      width: 16px;
      height: 16px;
      display: block;
    }

    .copy-icon::before,
    .copy-icon::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 2px;
    }

    .copy-icon::before {
      left: 2px;
      top: 3px;
      opacity: 0.58;
    }

    .copy-icon::after {
      left: 6px;
      top: 0;
      background: rgba(6, 14, 32, 0.8);
    }

    .copy-status {
      min-height: 14px;
      margin: -4px 0 0;
      color: var(--tertiary);
      font-size: 11px;
      font-weight: 750;
      text-align: center;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .copy-status.is-visible {
      opacity: 1;
    }

    @keyframes orbit {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @keyframes halo-pulse {
      0%, 100% {
        opacity: 0.55;
        transform: translate(-50%, -50%) rotateX(68deg) scale(0.98);
      }

      50% {
        opacity: 0.9;
        transform: translate(-50%, -50%) rotateX(68deg) scale(1.04);
      }
    }

    @keyframes winner-enter {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.82);
      }

      70% {
        transform: translateY(-3px) scale(1.035);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float-winner {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-16px);
      }
    }

    @media (max-width: 700px) {
      .hero {
        padding: 48px 18px 16px;
      }

      .winner-section {
        gap: 14px;
      }

      .winner-stage {
        width: 100%;
        min-height: clamp(300px, 86vw, 390px);
      }

      .winner-stage::before,
      .winner-stage::after,
      .halo {
        width: min(86vw, 350px);
      }

      .winner {
        font-size: clamp(112px, 42vw, 210px);
      }

      .starter-controls {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .starter-input {
        min-height: 54px;
      }

      .starter-title {
        margin-bottom: 2px;
      }

      .info-dock {
        width: min(100% - 32px, 520px);
        padding-bottom: 30px;
      }

      .usage-card {
        width: min(100%, 500px);
      }

      .usage-card[open] {
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="page">
    <main class="hero">
      <section class="winner-section" aria-live="polite">
        <p id="result-kicker" class="kicker">The Chosen One</p>
        <div class="winner-stage">
          <div class="halo" aria-hidden="true"></div>
          <button id="winner" class="winner" type="button" aria-label="당첨자 복사" disabled>-</button>
          <form id="starter-form" class="starter-form" autocomplete="off" hidden>
            <h1 class="starter-title">Random Picker</h1>
            <label class="starter-label" for="starter-names">Enter names</label>
            <div class="starter-controls">
              <input id="starter-names" class="starter-input" name="names" type="text" placeholder="a,b,c" aria-describedby="error">
              <button class="starter-button" type="submit">PICK!</button>
            </div>
          </form>
        </div>
        <p id="winner-copy-status" class="winner-copy-status" aria-live="polite"></p>
        <p id="error" class="error"></p>
      </section>
    </main>

    <footer class="info-dock">
      <ul class="meta" aria-label="뽑기 정보">
        <li><span class="meta-label">Date</span><span id="date">-</span></li>
        <li><span class="meta-label">Entries</span><span id="count">-</span></li>
      </ul>

      <div id="names" class="names" aria-label="후보 목록"></div>

      <details class="usage-card">
        <summary class="usage-title">
          <span class="usage-title-icon" aria-hidden="true"></span>
          Usage Examples
        </summary>

        <div class="usage-list">
          <div class="usage-row">
            <span class="usage-label">Example with date</span>
            <div class="url-field">
              <span id="example-with-date" class="url-value"></span>
              <button class="copy-button" type="button" data-copy-target="example-with-date" aria-label="날짜 포함 URL 복사">
                <span class="copy-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <div class="usage-row">
            <span class="usage-label">Today's default</span>
            <div class="url-field">
              <span id="example-default" class="url-value"></span>
              <button class="copy-button" type="button" data-copy-target="example-default" aria-label="오늘 기본 URL 복사">
                <span class="copy-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <p id="copy-status" class="copy-status" aria-live="polite">복사됨</p>
        </div>
      </details>
    </footer>
  </div>

  <script>
    const els = {
      count: document.querySelector("#count"),
      date: document.querySelector("#date"),
      defaultExample: document.querySelector("#example-default"),
      error: document.querySelector("#error"),
      exampleWithDate: document.querySelector("#example-with-date"),
      names: document.querySelector("#names"),
      copyStatus: document.querySelector("#copy-status"),
      resultKicker: document.querySelector("#result-kicker"),
      starterForm: document.querySelector("#starter-form"),
      starterNames: document.querySelector("#starter-names"),
      usageCard: document.querySelector(".usage-card"),
      usageSummary: document.querySelector(".usage-title"),
      winner: document.querySelector("#winner"),
      winnerCopyStatus: document.querySelector("#winner-copy-status")
    };
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function todayInLocalTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function splitRoute() {
      const params = new URLSearchParams(location.search);
      const queryNames = params.get("names");

      if (queryNames !== null) {
        const queryDate = params.get("date") || "";

        return {
          datePart: queryDate,
          namesPart: queryNames,
          source: "query"
        };
      }

      const hashRoute = decodeURIComponent(location.hash.replace(/^#\/?/, ""));

      if (hashRoute) {
        const [namesPart = "", datePart = ""] = hashRoute.split("/").filter(Boolean);

        return {
          datePart,
          namesPart,
          source: "hash"
        };
      }

      const [namesPart = "", datePart = ""] = getPathRouteSegments();

      return {
        datePart,
        namesPart,
        source: "path"
      };
    }

    function getPathRouteSegments() {
      const segments = decodeURIComponent(location.pathname).split("/").filter(Boolean);
      const appIndex = segments.findIndex((segment) => (
        segment === "random-picker" || segment === "random-picker.html"
      ));

      if (appIndex === -1) {
        return [];
      }

      return segments.slice(appIndex + 1);
    }

    function parseInput() {
      const { datePart = "", namesPart = "" } = splitRoute();
      const date = datePart.trim() || todayInLocalTime();
      const names = namesPart
        .split(",")
        .map((name) => name.trim())
        .filter(Boolean);

      return {
        date,
        dateWasMissing: datePart.trim() === "",
        names
      };
    }

    function reflectMissingDateInUrl(names, date, dateWasMissing) {
      if (!dateWasMissing || names.length === 0) {
        return;
      }

      const namesPart = names.map((name) => encodeURIComponent(name)).join(",");
      const params = new URLSearchParams(location.search);

      if (params.has("names")) {
        params.set("date", date);
        const nextQuery = params.toString().replace(/%2C/g, ",");
        const nextUrl = `${location.pathname}?${nextQuery}${location.hash}`;
        window.history.replaceState(null, "", nextUrl);
        return;
      }

      const hashRoute = decodeURIComponent(location.hash.replace(/^#\/?/, ""));

      if (hashRoute) {
        window.history.replaceState(null, "", `${location.pathname}${location.search}#/${namesPart}/${encodeURIComponent(date)}`);
        return;
      }

      const baseUrl = getBaseUrl();
      const nextPath = `${new URL(baseUrl).pathname}/${namesPart}/${encodeURIComponent(date)}`;
      window.history.replaceState(null, "", nextPath);
    }

    function hashString(value) {
      let hash = 2166136261;

      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }

    function pickWinner(names, date) {
      const seed = `${names.join(",")}|${date}`;
      const index = hashString(seed) % names.length;
      return names[index];
    }

    function buildExampleUrls(names, date) {
      const namesPart = names.map((name) => encodeURIComponent(name)).join(",");
      const baseUrl = getBaseUrl();

      return {
        defaultUrl: `${baseUrl}?names=${namesPart}`,
        withDateUrl: `${baseUrl}?names=${namesPart}&date=${encodeURIComponent(date)}`
      };
    }

    function getBaseUrl() {
      const segments = location.pathname.split("/").filter(Boolean);
      const appIndex = segments.findIndex((segment) => (
        segment === "random-picker" || segment === "random-picker.html"
      ));
      const baseSegments = appIndex === -1 ? segments : segments.slice(0, appIndex + 1);
      const basePath = baseSegments.length > 0 ? `/${baseSegments.join("/")}` : "/";
      return new URL(basePath, location.origin).toString().replace(/\/$/, "");
    }

    function renderExamples(names, date) {
      const { defaultUrl, withDateUrl } = buildExampleUrls(names, date);
      els.defaultExample.textContent = defaultUrl;
      els.exampleWithDate.textContent = withDateUrl;
    }

    function renderError(message) {
      els.error.textContent = message;
      els.error.classList.add("is-visible");
      els.winnerCopyStatus.classList.remove("is-visible");
      els.winner.textContent = "-";
      els.winner.disabled = true;
      els.winner.hidden = true;
      els.winner.setAttribute("aria-label", "당첨자 없음");
      els.resultKicker.hidden = true;
      els.starterForm.hidden = false;
      els.date.textContent = todayInLocalTime();
      els.count.textContent = "0";
      els.names.innerHTML = "";
      renderExamples(["a", "b", "c", "d"], todayInLocalTime());
      document.title = "Random Picker";
    }

    function render() {
      const { date, dateWasMissing, names } = parseInput();

      if (names.length === 0) {
        renderError("URL에 이름이 없어요. 후보를 콤마로 입력하고 해보기 버튼을 누르면 새 창에서 뽑기가 열립니다.");
        return false;
      }

      reflectMissingDateInUrl(names, date, dateWasMissing);

      const winner = pickWinner(names, date);

      els.error.classList.remove("is-visible");
      els.starterForm.hidden = true;
      els.resultKicker.hidden = false;
      els.winner.hidden = false;
      els.winner.textContent = winner;
      els.winner.disabled = false;
      els.winner.setAttribute("aria-label", `당첨자 ${winner} 복사`);
      els.date.textContent = date;
      els.count.textContent = String(names.length);
      renderExamples(names, date);
      document.title = `${date} / ${winner}`;
      els.names.replaceChildren(
        ...names.map((name) => {
          const item = document.createElement("span");
          item.className = name === winner ? "name is-winner" : "name";
          item.textContent = name;
          return item;
        })
      );

      return true;
    }

    function normalizeNamesInput(value) {
      return value
        .split(",")
        .map((name) => name.trim())
        .filter(Boolean);
    }

    function showStarterMessage(message) {
      els.error.textContent = message;
      els.error.classList.add("is-visible");
    }

    function buildNamesUrl(names) {
      const namesPart = names.map((name) => encodeURIComponent(name)).join(",");
      return `${getBaseUrl()}?names=${namesPart}`;
    }

    function formatWinnerCopyText(winner) {
      return `˚₊‧ ⋆˙⟡  ${winner}  ˎˊ˗ ₊˚ `;
    }

    async function copyText(text) {
      if (window.navigator && window.navigator.clipboard && window.isSecureContext) {
        try {
          await window.navigator.clipboard.writeText(text);
          return;
        } catch {
          // Fall back for browsers or embedded contexts that block Clipboard API.
        }
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, text.length);
      const didCopy = document.execCommand("copy");
      textarea.remove();

      if (!didCopy) {
        throw new Error("copy failed");
      }
    }

    function showCopyStatus(message) {
      els.copyStatus.textContent = message;
      els.copyStatus.classList.add("is-visible");
      window.clearTimeout(showCopyStatus.timeoutId);
      showCopyStatus.timeoutId = window.setTimeout(() => {
        els.copyStatus.classList.remove("is-visible");
      }, 1200);
    }

    function showWinnerCopyStatus(message) {
      els.winnerCopyStatus.textContent = message;
      els.winnerCopyStatus.classList.add("is-visible");
      window.clearTimeout(showWinnerCopyStatus.timeoutId);
      showWinnerCopyStatus.timeoutId = window.setTimeout(() => {
        els.winnerCopyStatus.classList.remove("is-visible");
      }, 1400);
    }

    els.winner.addEventListener("click", async () => {
      const winner = els.winner.textContent.trim();

      if (!winner || winner === "-") {
        return;
      }

      try {
        await copyText(formatWinnerCopyText(winner));
        showWinnerCopyStatus("복사됨");
      } catch {
        showWinnerCopyStatus("복사 실패");
      }
    });

    els.starterForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const names = normalizeNamesInput(els.starterNames.value);

      if (names.length === 0) {
        showStarterMessage("이름을 하나 이상 입력해주세요. 예: a,b,c");
        els.starterNames.focus();
        return;
      }

      const nextUrl = buildNamesUrl(names);
      const opened = window.open(nextUrl, "_blank");

      if (opened) {
        opened.opener = null;
        showStarterMessage("새 창에서 뽑기를 열었어요.");
        return;
      }

      showStarterMessage("새 창이 차단됐어요. 팝업 허용 후 다시 눌러주세요.");
    });

    document.querySelectorAll(".copy-button").forEach((button) => {
      button.addEventListener("click", async () => {
        const target = document.querySelector(`#${button.dataset.copyTarget}`);

        try {
          await copyText(target.textContent);
          showCopyStatus("복사됨");
        } catch {
          showCopyStatus("복사 실패");
        }
      });
    });

    els.usageSummary.addEventListener("click", (event) => {
      event.preventDefault();
      els.usageCard.open = !els.usageCard.open;
    });

    function launchBackground() {
      const canvas = document.querySelector("#bg-canvas");
      const context = canvas.getContext("2d");
      const stars = Array.from({ length: 90 }, () => ({
        x: Math.random(),
        y: Math.random(),
        radius: Math.random() * 1.8 + 0.3,
        speed: Math.random() * 0.16 + 0.04,
        phase: Math.random() * Math.PI * 2
      }));

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        const width = document.documentElement.clientWidth;
        const height = document.documentElement.clientHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function draw(now) {
        const width = document.documentElement.clientWidth;
        const height = document.documentElement.clientHeight;
        const time = now * 0.001;
        const gradient = context.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, "#060e20");
        gradient.addColorStop(0.38, "#101a38");
        gradient.addColorStop(0.68, "#171036");
        gradient.addColorStop(1, "#00324d");

        context.clearRect(0, 0, width, height);
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);

        context.save();
        context.globalCompositeOperation = "screen";
        [
          { x: width * 0.2, y: height * 0.2, color: "rgba(124, 58, 237, 0.34)", radius: width * 0.32 },
          { x: width * 0.78, y: height * 0.28, color: "rgba(0, 210, 255, 0.22)", radius: width * 0.25 },
          { x: width * 0.5, y: height * 0.9, color: "rgba(255, 182, 144, 0.16)", radius: width * 0.28 }
        ].forEach((glow, index) => {
          const pulse = Math.sin(time * 0.7 + index) * 22;
          const radial = context.createRadialGradient(glow.x, glow.y, 0, glow.x, glow.y, glow.radius + pulse);
          radial.addColorStop(0, glow.color);
          radial.addColorStop(1, "transparent");
          context.fillStyle = radial;
          context.fillRect(0, 0, width, height);
        });
        context.restore();

        context.save();
        context.globalAlpha = 0.62;
        stars.forEach((star) => {
          const x = (star.x * width + Math.sin(time * star.speed + star.phase) * 18) % width;
          const y = (star.y * height + Math.cos(time * star.speed + star.phase) * 18) % height;
          context.beginPath();
          context.arc(x, y, star.radius, 0, Math.PI * 2);
          context.fillStyle = "rgba(218, 226, 253, 0.56)";
          context.fill();
        });
        context.restore();

        if (!reduceMotion.matches) {
          requestAnimationFrame(draw);
        }
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      requestAnimationFrame(draw);
    }

    function launchConfetti() {
      if (reduceMotion.matches) {
        return;
      }

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      const colors = ["#d2bbff", "#89ceff", "#ffb690", "#7c3aed", "#00d2ff", "#ffffff"];
      const pieces = Array.from({ length: 150 }, () => ({
        color: colors[Math.floor(Math.random() * colors.length)],
        height: 8 + Math.random() * 16,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.24,
        speedX: (Math.random() - 0.5) * 6,
        speedY: 2.2 + Math.random() * 5,
        width: 5 + Math.random() * 10,
        x: Math.random() * window.innerWidth,
        y: -40 - Math.random() * window.innerHeight * 0.58
      }));
      const start = performance.now();
      const duration = 1900;
      let animationId = 0;

      canvas.id = "confetti-canvas";
      document.body.appendChild(canvas);

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        const width = document.documentElement.clientWidth;
        const height = document.documentElement.clientHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function drawFrame(now) {
        const progress = Math.min((now - start) / duration, 1);
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);

        pieces.forEach((piece) => {
          piece.x += piece.speedX;
          piece.y += piece.speedY + progress * 2.4;
          piece.rotation += piece.rotationSpeed;

          context.save();
          context.translate(piece.x, piece.y);
          context.rotate(piece.rotation);
          context.globalAlpha = 1 - Math.max(0, progress - 0.72) / 0.28;
          context.fillStyle = piece.color;
          context.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
          context.restore();
        });

        if (progress < 1) {
          animationId = requestAnimationFrame(drawFrame);
          return;
        }

        window.removeEventListener("resize", resizeCanvas);
        canvas.remove();
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      animationId = requestAnimationFrame(drawFrame);
      window.setTimeout(() => {
        cancelAnimationFrame(animationId);
        window.removeEventListener("resize", resizeCanvas);
        canvas.remove();
      }, duration + 350);
    }

    window.addEventListener("hashchange", render);
    const hasWinner = render();
    launchBackground();

    if (hasWinner) {
      launchConfetti();
    }
  </script>
</body>
</html>
