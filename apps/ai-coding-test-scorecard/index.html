document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ee5e540e-773f-4dd8-bca7-263c45d68736\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/*\nCopyright (c) 2021 Kil Hyung-jin, with Reserved Font Name Pretendard.\nhttps://github.com/orioncactus/pretendard\n\nThis Font Software is licensed under the SIL Open Font License, Version 1.1.\nThis license is copied below, and is also available with a FAQ at:\nhttp://scripts.sil.org/OFL\n*/\n\n@font-face {\n\tfont-family: 'Pretendard Variable';\n\tfont-weight: 45 920;\n\tfont-style: normal;\n\tfont-display: swap;\n\tsrc: url(\"3ef1a2fc-f396-4049-b355-dadc40f0ca62\") format('woff2-variations');\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --paper: #F4F5F8;\n    --card: #FFFFFF;\n    --ink: #15171C;\n    --ink-2: #4C515C;\n    --ink-3: #878D99;\n    --line: #E7E9EE;\n    --line-2: #D7DAE1;\n    --accent: #2B2782;\n    --w10: #CBC9F0;\n    --w15: #9591E0;\n    --w20: #5F5ACE;\n    --w30: #2B2782;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n  body {\n    font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;\n    background: var(--paper);\n    color: var(--ink);\n    line-height: 1.6;\n    font-feature-settings: \"tnum\" 1;\n    padding: 48px 24px 72px;\n  }\n  a { color: var(--accent); text-decoration: none; }\n  a:hover { color: #211d68; }\n  ::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }\n  .sheet { max-width: 1060px; margin: 0 auto; }\n\n  .head {\n    background: var(--card);\n    border: 1px solid var(--line);\n    border-radius: 20px;\n    padding: 38px 40px 34px;\n    box-shadow: 0 1px 2px rgba(21,23,28,.04), 0 18px 40px -28px rgba(21,23,28,.22);\n    position: relative;\n    overflow: hidden;\n  }\n  .head::before {\n    content: \"\";\n    position: absolute; inset: 0 0 auto 0;\n    height: 4px;\n    background: linear-gradient(90deg, var(--w10) 0 10%, var(--w15) 10% 25%, var(--w10) 25% 35%, var(--w15) 35% 50%, var(--w20) 50% 70%, var(--w30) 70% 100%);\n  }\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 8px;\n    font-size: 11.5px; font-weight: 700; letter-spacing: .18em;\n    color: var(--accent); text-transform: uppercase;\n  }\n  .eyebrow::before { content: \"\"; width: 22px; height: 1.5px; background: var(--accent); display: inline-block; }\n  .title { margin-top: 14px; font-size: clamp(28px, 4.4vw, 42px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }\n  .purpose { margin-top: 12px; font-size: 14.5px; color: var(--ink-2); font-weight: 500; }\n  .purpose b { color: var(--ink); font-weight: 700; }\n\n  .meta { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }\n  .chip { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 13px; }\n  .chip b { color: var(--accent); font-weight: 800; }\n\n  /* Identity inputs */\n  .io { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }\n  .io .field { display: flex; flex-direction: column; gap: 6px; }\n  .io label { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }\n  .io input {\n    font-family: inherit; font-size: 14px; font-weight: 500;\n    padding: 9px 13px; border: 1px solid var(--line-2); border-radius: 10px;\n    background: var(--paper); color: var(--ink); min-width: 168px;\n    transition: border-color .15s, box-shadow .15s;\n  }\n  .io input::placeholder { color: var(--ink-3); font-weight: 400; }\n  .io input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }\n\n  /* Weight spine */\n  .spine-wrap { margin-top: 30px; }\n  .spine-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 9px; }\n  .spine-label span:last-child { letter-spacing: 0; font-weight: 600; text-transform: none; }\n  .spine { display: flex; gap: 3px; height: 52px; border-radius: 10px; overflow: hidden; }\n  .seg { display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; position: relative; transform-origin: left center; }\n  .seg .seg-id { font-size: 10px; font-weight: 700; opacity: .82; letter-spacing: .06em; }\n  .seg .seg-pct { font-size: 15px; font-weight: 800; margin-top: 1px; }\n  .seg.on-light { color: var(--ink); }\n  .seg.on-light .seg-id { opacity: .58; }\n\n  /* Cards */\n  .grid { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }\n  .card {\n    background: var(--card); border: 1px solid var(--line); border-radius: 18px;\n    padding: 24px 26px 26px;\n    box-shadow: 0 1px 2px rgba(21,23,28,.03), 0 12px 30px -26px rgba(21,23,28,.2);\n    position: relative;\n  }\n  .card__head { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }\n  .card__id { flex: none; font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--ink-3); border: 1.5px solid var(--line-2); border-radius: 9px; width: 42px; height: 42px; display: grid; place-items: center; }\n  .card.is-answered .card__id { color: #fff; background: var(--accent); border-color: var(--accent); }\n  .card__titles { flex: 1 1 auto; min-width: 0; }\n  .card__area { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }\n  .card__item { margin-top: 3px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }\n  .card__weight { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 66px; height: 42px; border-radius: 11px; font-weight: 800; }\n  .card__weight .wv { font-size: 19px; line-height: 1; }\n  .card__weight .wl { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; opacity: .8; margin-top: 3px; }\n  .w10 { background: var(--w10); color: var(--accent); }\n  .w15 { background: var(--w15); color: #fff; }\n  .w20 { background: var(--w20); color: #fff; }\n  .w30 { background: var(--w30); color: #fff; }\n  .maxtag { position: absolute; top: 22px; right: 100px; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--w30); background: var(--w10); border-radius: 6px; padding: 3px 7px; }\n  .card__body { margin-top: 20px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 30px; }\n  @media (max-width: 760px) { .card__body { grid-template-columns: 1fr; gap: 22px; } .maxtag { display: none; } }\n\n  .col-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 13px; display: flex; align-items: center; gap: 8px; }\n  .col-label::after { content: \"\"; flex: 1; height: 1px; background: var(--line); }\n\n  .crit__list { list-style: none; display: flex; flex-direction: column; gap: 12px; }\n  .crit__list li { position: relative; padding-left: 18px; font-size: 14px; color: var(--ink-2); line-height: 1.62; }\n  .crit__list li::before { content: \"\"; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; border-radius: 2px; background: var(--w15); }\n  .crit__list li.key { color: var(--ink); font-weight: 600; }\n  .crit__list li.key::before { background: var(--accent); }\n  .crit__list li .sub { display: block; color: var(--ink-3); font-size: 12.5px; font-weight: 400; margin-top: 3px; }\n\n  /* Levels (interactive buttons) */\n  .levels { display: flex; flex-direction: column; gap: 10px; }\n  .level {\n    display: grid; grid-template-columns: 30px 46px 1fr; align-items: center; gap: 12px;\n    padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line);\n    position: relative; width: 100%; text-align: left;\n    font-family: inherit; color: inherit; background: var(--card); cursor: pointer;\n    transition: border-color .15s, box-shadow .15s, background .15s, opacity .15s, transform .08s;\n  }\n  .level:hover { border-color: var(--line-2); }\n  .level:active { transform: translateY(1px); }\n  .level:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n  .level__chip { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800; }\n  .meter { display: flex; gap: 3px; }\n  .meter i { width: 12px; height: 20px; border-radius: 3px; background: var(--line-2); display: block; }\n  .level__desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; padding-right: 20px; }\n\n  .level--low  .level__chip { background: #EDEEF2; color: var(--ink-2); border: 1px solid var(--line-2); }\n  .level--low  .meter i:nth-child(1) { background: var(--w15); }\n  .level--mid  .level__chip { background: #E4E3F4; color: var(--w20); }\n  .level--mid  .meter i:nth-child(-n+2) { background: var(--w20); }\n  .level--high .level__chip { background: #DAD8EF; color: var(--accent); }\n  .level--high .meter i { background: var(--accent); }\n  .level--high .level__desc { color: var(--ink-2); }\n\n  /* selected + dim states */\n  .level.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 32%, transparent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }\n  .level.is-selected::after { content: \"✓\"; position: absolute; top: 7px; right: 10px; font-size: 13px; font-weight: 900; color: var(--accent); }\n  .card.is-answered .level:not(.is-selected) { opacity: .48; }\n  .card.is-answered .level:not(.is-selected):hover { opacity: .78; }\n\n  /* Summary / result panel */\n  .summary { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px 34px 32px; box-shadow: 0 1px 2px rgba(21,23,28,.04), 0 18px 40px -28px rgba(21,23,28,.22); position: relative; overflow: hidden; }\n  .summary::before { content: \"\"; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--w10), var(--w15), var(--w20), var(--w30)); }\n  .summary__top { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }\n  .score { display: flex; align-items: baseline; gap: 10px; }\n  .score__label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); align-self: center; margin-right: 4px; }\n  .score__num { font-size: 46px; font-weight: 800; letter-spacing: -.04em; color: var(--accent); line-height: 1; }\n  .score__den { font-size: 17px; font-weight: 700; color: var(--ink-3); }\n  .score__note { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-top: 8px; }\n  .actions { display: flex; gap: 10px; flex-wrap: wrap; }\n  .btn { font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; padding: 13px 22px; cursor: pointer; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); transition: border-color .15s, background .15s, color .15s, transform .08s; }\n  .btn:hover { border-color: var(--accent); color: var(--accent); }\n  .btn:active { transform: translateY(1px); }\n  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n  .btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }\n  .btn--primary:hover { background: #211d68; color: #fff; border-color: #211d68; }\n  .preview { margin-top: 22px; }\n  .preview__label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }\n  .preview__label::after { content: \"\"; flex: 1; height: 1px; background: var(--line); }\n  .preview pre { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; font-family: 'Pretendard Variable', Pretendard, system-ui, monospace; font-size: 13px; line-height: 1.75; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }\n\n  .foot { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-3); padding: 0 6px; }\n  .foot .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }\n  .foot .lg { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }\n  .foot .sw { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }\n\n  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  .card { animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }\n  .card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.09s}\n  .card:nth-child(3){animation-delay:.14s} .card:nth-child(4){animation-delay:.19s}\n  .card:nth-child(5){animation-delay:.24s} .card:nth-child(6){animation-delay:.29s}\n  .seg { animation: grow .7s cubic-bezier(.2,.7,.3,1) both; }\n  @media (prefers-reduced-motion: reduce) { .card, .seg { animation: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"sheet\">\n  <header class=\"head\">\n    <span class=\"eyebrow\">FE Competency · Rubric<\u002Fspan>\n    <h1 class=\"title\">AI 코딩테스트 역량평가 채점표<\u002Fh1>\n    <p class=\"purpose\">배경 — <b>self feedback<\u002Fb> &amp; <b>면접 평가<\u002Fb> 용도. AI를 도구로 다루는 실제 역량을 6개 영역으로 진단한다.<\u002Fp>\n    <div class=\"meta\">\n      <span class=\"chip\">평가 영역 <b>6<\u002Fb><\u002Fspan>\n      <span class=\"chip\">가중치 합 <b>100%<\u002Fb><\u002Fspan>\n      <span class=\"chip\">항목당 <b>1–5점<\u002Fb> · 하 · 중 · 상 앵커<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"io\">\n      <div class=\"field\">\n        <label>응시자<\u002Flabel>\n        <input type=\"text\" placeholder=\"이름 입력\" value=\"{{ evaluee }}\" sc-camel-on-change=\"{{ onEvaluee }}\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>평가자<\u002Flabel>\n        <input type=\"text\" placeholder=\"이름 입력\" value=\"{{ evaluator }}\" sc-camel-on-change=\"{{ onEvaluator }}\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>평가일<\u002Flabel>\n        <input type=\"date\" value=\"{{ date }}\" sc-camel-on-change=\"{{ onDate }}\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"spine-wrap\">\n      <div class=\"spine-label\"><span>Weight Distribution<\u002Fspan><span>영역별 가중치 · 합 100%<\u002Fspan><\u002Fdiv>\n      <div class=\"spine\">\n        <div class=\"seg on-light\" style=\"flex:10;background:var(--w10)\"><span class=\"seg-id\">01<\u002Fspan><span class=\"seg-pct\">10%<\u002Fspan><\u002Fdiv>\n        <div class=\"seg\" style=\"flex:15;background:var(--w15)\"><span class=\"seg-id\">02<\u002Fspan><span class=\"seg-pct\">15%<\u002Fspan><\u002Fdiv>\n        <div class=\"seg on-light\" style=\"flex:10;background:var(--w10)\"><span class=\"seg-id\">03<\u002Fspan><span class=\"seg-pct\">10%<\u002Fspan><\u002Fdiv>\n        <div class=\"seg\" style=\"flex:15;background:var(--w15)\"><span class=\"seg-id\">04<\u002Fspan><span class=\"seg-pct\">15%<\u002Fspan><\u002Fdiv>\n        <div class=\"seg\" style=\"flex:20;background:var(--w20)\"><span class=\"seg-id\">05<\u002Fspan><span class=\"seg-pct\">20%<\u002Fspan><\u002Fdiv>\n        <div class=\"seg\" style=\"flex:30;background:var(--w30)\"><span class=\"seg-id\">06<\u002Fspan><span class=\"seg-pct\">30%<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main class=\"grid\">\n    <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"6\">\n      <article class=\"{{ a.cardClass }}\">\n        <sc-if value=\"{{ a.max }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"maxtag\">최고 가중치<\u002Fspan><\u002Fsc-if>\n        <div class=\"card__head\">\n          <div class=\"card__id\">{{ a.id }}<\u002Fdiv>\n          <div class=\"card__titles\">\n            <div class=\"card__area\">{{ a.area }}<\u002Fdiv>\n            <div class=\"card__item\">{{ a.item }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card__weight {{ a.wclass }}\"><span class=\"wv\">{{ a.weightPct }}<\u002Fspan><span class=\"wl\">WEIGHT<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card__body\">\n          <section class=\"crit\">\n            <div class=\"col-label\">세부 평가 기준<\u002Fdiv>\n            <ul class=\"crit__list\">\n              <sc-for list=\"{{ a.crit }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <li class=\"{{ c.liClass }}\">{{ c.text }}<sc-if value=\"{{ c.sub }}\"><span class=\"sub\">{{ c.sub }}<\u002Fspan><\u002Fsc-if><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsection>\n          <section class=\"levels-wrap\">\n            <div class=\"col-label\">평가 레벨 · 클릭하여 선택<\u002Fdiv>\n            <div class=\"levels\">\n              <sc-for list=\"{{ a.levels }}\" as=\"lv\" hint-placeholder-count=\"3\">\n                <button type=\"button\" class=\"{{ lv.btnClass }}\" sc-camel-on-click=\"{{ lv.onSelect }}\">\n                  <span class=\"level__chip\">{{ lv.k }}<\u002Fspan>\n                  <span class=\"meter\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n                  <p class=\"level__desc\">{{ lv.desc }}<\u002Fp>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fmain>\n\n  <section class=\"summary\">\n    <div class=\"summary__top\">\n      <div class=\"score\">\n        <span class=\"score__label\">가중 점수<\u002Fspan>\n        <span class=\"score__num\">{{ scoreNum }}<\u002Fspan>\n        <span class=\"score__den\">{{ scoreDen }}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"actions\">\n        <button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{ reset }}\">초기화<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn--primary\" sc-camel-on-click=\"{{ copy }}\">{{ copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"score__note\">{{ completedNote }}<\u002Fdiv>\n    <div class=\"preview\">\n      <div class=\"preview__label\">복사될 요약<\u002Fdiv>\n      <pre>{{ summaryText }}<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer class=\"foot\">\n    <div class=\"legend\">\n      <span class=\"lg\"><span class=\"sw\" style=\"background:var(--w10)\"><\u002Fspan>10%<\u002Fspan>\n      <span class=\"lg\"><span class=\"sw\" style=\"background:var(--w15)\"><\u002Fspan>15%<\u002Fspan>\n      <span class=\"lg\"><span class=\"sw\" style=\"background:var(--w20)\"><\u002Fspan>20%<\u002Fspan>\n      <span class=\"lg\"><span class=\"sw\" style=\"background:var(--w30)\"><\u002Fspan>30%<\u002Fspan>\n      <span>· 색이 진할수록 가중치가 큼<\u002Fspan>\n    <\u002Fdiv>\n    <div>레벨 앵커 &nbsp;<b style=\"color:var(--ink-2)\">하<\u002Fb> · <b style=\"color:var(--w20)\">중<\u002Fb> · <b style=\"color:var(--accent)\">상<\u002Fb>&nbsp; (하 1점 · 중 3점 · 상 5점 환산)<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst POINT = { '하': 1, '중': 3, '상': 5 };\nconst STORE_KEY = 'ai-coding-rubric-v1';\n\nclass Component extends DCLogic {\n  AREAS = [\n    { id: '01', area: '프롬프트 및 지시 역량', item: '프롬프트 효율성', weight: 10, wclass: 'w10',\n      crit: [\n        { text: '컨텍스트(요구사항, 기존 코드)를 명확히 제시하는가?' },\n        { text: '모호한 지시 대신 구체적인 제약조건(예: React 18, Tailwind, 모듈화 요구)을 포함하는가?' },\n        { text: '불필요하게 길거나 중복된 지시 없이 간결하고 타깃팅된 질문을 던지는가?' },\n      ],\n      levels: [\n        { k: '하', cls: 'level--low', desc: '모호하고 막연한 지시 (예: “만들어줘”)' },\n        { k: '중', cls: 'level--mid', desc: '지시는 구체적이나 컨텍스트가 부족함' },\n        { k: '상', cls: 'level--high', desc: '컨텍스트, 제약사항, 출력 포맷까지 간결하게 지시' },\n      ] },\n    { id: '02', area: '워크플로우 & 프로세스', item: '전체 흐름의 효율성', weight: 15, wclass: 'w15',\n      crit: [\n        { text: 'AI 응답 결과를 그대로 복붙하여 무한 수정(재작업)에 빠지지 않는가?' },\n        { text: '문제 해결 단계를 체계적으로 나눴는가?', sub: '설계 → UI/컴포넌트 → 로직/상태 → 테스트 · 스캐폴딩 → 구현 세부 → 리팩토링 → 개선 → (학습)' },\n        { text: '미사용 코드, 반복적인 똑같은 질문 생성 등 중복 작업을 최소화하는가?' },\n      ],\n      levels: [\n        { k: '하', cls: 'level--low', desc: '동일 오류로 AI와 무한 반복 대화 (도돌이표)' },\n        { k: '중', cls: 'level--mid', desc: '몇 번의 시행착오 후 해결하나 과정이 매끄럽지 않음' },\n        { k: '상', cls: 'level--high', desc: '단계별로 AI를 제어하며 불필요한 루프 없이 완수' },\n      ] },\n    { id: '03', area: '도구 활용 역량', item: '사용 도구 수준 및 커스텀', weight: 10, wclass: 'w10',\n      crit: [\n        { text: '단순 채팅 UI(예: ChatGPT 웹)에 의존하는가, IDE 연동 도구(Cursor, Copilot 등)를 적극 사용하는가?' },\n        { text: 'MCP, Custom Rules(.cursorrules), Agent mode, Workflow Script 등을 활용해 작업 환경을 최적화하는가?' },\n      ],\n      levels: [\n        { k: '하', cls: 'level--low', desc: '단순 웹 기반 AI 질의응답 복붙' },\n        { k: '중', cls: 'level--mid', desc: 'IDE 내 AI Inline Edit, Chat 기능 기본 활용' },\n        { k: '상', cls: 'level--high', desc: 'Agent Mode, MCP, 하네스, 커스텀 컨텍스트(.cursorrules 등) 적극 활용' },\n      ] },\n    { id: '04', area: '문제 해결 & 비판적 사고', item: '문제 접근 및 AI 코드 검증', weight: 15, wclass: 'w15',\n      crit: [\n        { text: '문제 요구사항을 정확히 파악하고 AI에게 로드맵을 먼저 제시/요구하는가?' },\n        { text: 'AI가 제안한 코드의 보안, 성능(리렌더링), 접근성(a11y) 문제를 비판적으로 검토하고 수정하는가?', key: true },\n        { text: '할루시네이션(잘못된 라이브러리/API 호출)을 빠르게 알아채고 정정하는가?' },\n      ],\n      levels: [\n        { k: '하', cls: 'level--low', desc: 'AI 코드를 검증 없이 그대로 채택하여 버그 발생' },\n        { k: '중', cls: 'level--mid', desc: '오류 발생 시에만 AI에게 재질문하여 수정' },\n        { k: '상', cls: 'level--high', desc: '생성된 코드를 즉시 검증하고, Edge case까지 스스로/AI와 검토' },\n      ] },\n    { id: '05', area: 'FE 아키텍처 & 품질 Control', item: '최종 코드 품질 및 가독성', weight: 20, wclass: 'w20',\n      crit: [\n        { text: '프론트엔드 모범 사례(컴포넌트 분리, 상태 관리 구조, Custom Hook 추출)가 유지되었는가?' },\n        { text: 'AI 특유의 ‘하나의 파일에 모든 로직 쑤셔넣기(Monolithic Component)’를 방지하고 refactoring을 검토했는가?' },\n      ],\n      levels: [\n        { k: '하', cls: 'level--low', desc: '작동은 하나 가독성이 낮고 단일 파일로 거대함' },\n        { k: '중', cls: 'level--mid', desc: '기본적인 컴포넌트 분리는 되었으나 결합도가 높음' },\n        { k: '상', cls: 'level--high', desc: 'Clean Architecture, 상태/UI 분리, 가독성 높은 모듈화 달성' },\n      ] },\n    { id: '06', area: '코드 오너십 및 설명', item: '작업물 설명 및 당위성 (Explainability)', weight: 30, wclass: 'w30', max: true,\n      crit: [\n        { text: 'AI가 작성한 코드의 핵심 로직과 상태 흐름을 완벽히 이해하고 설명할 수 있는가?', key: true },\n        { text: '“왜 AI가 이 방식을 선택했는지” 당위성을 설명하거나, 더 나은 대안을 제시할 수 있는가?' },\n        { text: '디버깅 질문이나 특정 줄의 역할 질문에 즉각 답변하는가?' },\n      ],\n      levels: [\n        { k: '하', cls: 'level--low', desc: '“AI가 짜준 거라 잘 모르겠습니다” 수준, 로직 파악 불가' },\n        { k: '중', cls: 'level--mid', desc: '전체적인 흐름은 아나, 디테일한 상태/Side Effect 설명 부족' },\n        { k: '상', cls: 'level--high', desc: 'AI 코드를 완벽히 파악하여 본인이 직접 짠 것처럼 논리적으로 설명' },\n      ] },\n  ];\n\n  state = {\n    picks: {},\n    evaluee: '',\n    evaluator: '',\n    date: new Date().toISOString().slice(0, 10),\n    copied: false,\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(STORE_KEY);\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({\n          picks: d.picks || {},\n          evaluee: d.evaluee || '',\n          evaluator: d.evaluator || '',\n          date: d.date || this.state.date,\n        });\n      }\n    } catch (e) {}\n  }\n\n  save() {\n    try {\n      const { picks, evaluee, evaluator, date } = this.state;\n      localStorage.setItem(STORE_KEY, JSON.stringify({ picks, evaluee, evaluator, date }));\n    } catch (e) {}\n  }\n\n  select(id, k) {\n    this.setState(s => {\n      const picks = { ...s.picks };\n      if (picks[id] === k) delete picks[id];\n      else picks[id] = k;\n      return { picks };\n    }, () => this.save());\n  }\n\n  reset() {\n    this.setState({ picks: {} }, () => this.save());\n  }\n\n  flash() {\n    this.setState({ copied: true });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copied: false }), 1800);\n  }\n\n  fallbackCopy(text) {\n    try {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      ta.style.position = 'fixed';\n      ta.style.opacity = '0';\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      document.body.removeChild(ta);\n      this.flash();\n    } catch (e) {}\n  }\n\n  copy() {\n    const text = this._summary || '';\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(() => this.flash()).catch(() => this.fallbackCopy(text));\n    } else {\n      this.fallbackCopy(text);\n    }\n  }\n\n  renderVals() {\n    const picks = this.state.picks;\n\n    const areas = this.AREAS.map(a => {\n      const sel = picks[a.id];\n      const answered = !!sel;\n      return {\n        id: a.id, area: a.area, item: a.item, wclass: a.wclass,\n        weightPct: a.weight + '%', max: !!a.max,\n        cardClass: 'card' + (answered ? ' is-answered' : ''),\n        crit: a.crit.map(c => ({ text: c.text, sub: c.sub || '', liClass: c.key ? 'key' : '' })),\n        levels: a.levels.map(l => ({\n          k: l.k, desc: l.desc,\n          btnClass: 'level ' + l.cls + (sel === l.k ? ' is-selected' : ''),\n          onSelect: () => this.select(a.id, l.k),\n        })),\n      };\n    });\n\n    let weighted = 0, completed = 0;\n    for (const a of this.AREAS) {\n      const s = picks[a.id];\n      if (s) { completed++; weighted += a.weight * (POINT[s] / 5); }\n    }\n    weighted = Math.round(weighted * 10) / 10;\n    const scoreNum = String(Math.round(weighted));\n    const scoreDen = '/ 100';\n    const completedNote = completed >= 6\n      ? '6 / 6 평가 완료 · 가중 점수는 하 1점 · 중 3점 · 상 5점 기준입니다.'\n      : completed + ' / 6 평가 완료 · 미평가 항목은 0점으로 계산됩니다.';\n\n    const evaluee = (this.state.evaluee || '').trim() || '이름없음';\n    const evaluator = (this.state.evaluator || '').trim() || '평가자미상';\n    const lines = [];\n    lines.push('AI 코딩테스트 역량평가 채점표');\n    lines.push(`응시자: ${evaluee}   평가자: ${evaluator}   평가일: ${this.state.date || '-'}`);\n    lines.push('────────────────────────');\n    for (const a of this.AREAS) {\n      const s = picks[a.id] || '미평가';\n      lines.push(`${a.id}. ${a.area} (${a.weight}%) - ${s}`);\n    }\n    lines.push('────────────────────────');\n    lines.push(`가중 점수: ${scoreNum} / 100`);\n    lines.push(`평가 완료: ${completed} / 6`);\n    const summaryText = lines.join('\\n');\n    this._summary = summaryText;\n\n    return {\n      areas, scoreNum, scoreDen, completedNote, summaryText,\n      copyLabel: this.state.copied ? '복사 완료 ✓' : '결과 복사',\n      copy: () => this.copy(),\n      reset: () => this.reset(),\n      evaluee: this.state.evaluee,\n      evaluator: this.state.evaluator,\n      date: this.state.date,\n      onEvaluee: e => this.setState({ evaluee: e.target.value }, () => this.save()),\n      onEvaluator: e => this.setState({ evaluator: e.target.value }, () => this.save()),\n      onDate: e => this.setState({ date: e.target.value }, () => this.save()),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
